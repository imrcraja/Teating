name: Build LightSpeedX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - name: Build with Gradle
        shell: bash
        run: |
          set +e
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            jar_file=$(find build/libs -maxdepth 1 -type f -name 'lightspeedx-*.jar' ! -name '*sources.jar' | head -n 1)
            echo "JAR=$jar_file" >> build.log
            base64 -w0 "$jar_file" > LightSpeedX.jar.b64
          fi
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LightSpeedX-build
          path: |
            LightSpeedX.jar.b64
            build.log
          if-no-files-found: warn
